name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline tests
        run: python -m unittest discover -s tests -v

  local-markdown-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check local Markdown links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          markdown_files = sorted(path for path in root.rglob("*.md") if ".git" not in path.parts)
          link_pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          failures = []

          for markdown_file in markdown_files:
              text = markdown_file.read_text(encoding="utf-8")
              for raw_target in link_pattern.findall(text):
                  target = raw_target.strip().split(maxsplit=1)[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#", 1)[0].split("?", 1)[0]
                  if target and not (markdown_file.parent / target).resolve().exists():
                      failures.append(f"{markdown_file.relative_to(root)}: {target}")

          if failures:
              raise SystemExit("Broken local Markdown links:\n" + "\n".join(failures))
          print(f"Checked {len(markdown_files)} Markdown files")
          PY
